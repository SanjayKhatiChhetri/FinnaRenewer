name: Finna Renewer

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run Finna Renewer
        env:
          FINNA_ID: ${{ secrets.FINNA_ID }}
          FINNA_PASSWORD: ${{ secrets.FINNA_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RENEW_DAYS_BEFORE: "7"
        run: |
          go run .

